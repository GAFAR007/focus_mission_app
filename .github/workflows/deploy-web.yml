# WHAT:
# Guard release metadata on main and allow validated release republishing.
# WHY:
# Production publication must follow the Release Agent, not an unversioned push.
# HOW:
# Check the canonical release/source inventory, test and build, and publish only
# an explicitly dispatched validated release with the matching backend live.

name: Deploy Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.7'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Guard frontend production version
        run: node tool/release.mjs check --frontend-only

      - name: Read paired release
        id: release
        run: echo "version=$(node -p \"require('./release/history.json').releases[0].version\")" >> "$GITHUB_OUTPUT"

      - name: Checkout paired backend release
        uses: actions/checkout@v4
        with:
          repository: GAFAR007/focus_mission_backend
          ref: v${{ steps.release.outputs.version }}
          path: .release-work/backend
          fetch-depth: 0

      - name: Guard paired release and tested source
        run: node tool/release.mjs check --backend .release-work/backend

      - name: Test release tooling
        run: node --test tool/release.test.mjs

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze app
        run: flutter analyze

      - name: Run widget tests
        run: flutter test

      - name: Build production web bundle
        run: flutter build web --release

      - name: Validate Netlify secrets
        if: github.event_name == 'workflow_dispatch'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID must be set in GitHub Actions secrets."
            exit 1
          fi

      - name: Install Netlify CLI
        if: github.event_name == 'workflow_dispatch'
        run: npm install --global netlify-cli

      - name: Confirm exact backend is live
        if: github.event_name == 'workflow_dispatch'
        run: node tool/release.mjs check-backend --backend .release-work/backend

      - name: Deploy to Netlify
        if: github.event_name == 'workflow_dispatch'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: >
          netlify deploy
          --dir=build/web
          --prod
          --no-build
          --site "$NETLIFY_SITE_ID"
          --message "GitHub Actions deploy ${GITHUB_SHA}"

      - name: Verify published version and artifacts
        if: github.event_name == 'workflow_dispatch'
        run: node tool/release.mjs verify-public --backend .release-work/backend
